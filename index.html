<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    h2 { margin: 1rem 0 0; font-size: 1rem; }
    pre { margin: 0; white-space: pre-wrap; font: inherit; }
    #topic { margin: 0; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status"></p>
  <section id="result" hidden>
    <h2>Тема</h2>
    <p id="topic"></p>
    <h2>Черновик ответа</h2>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    import { bindTriageForm } from "/triage-client.mjs";

    bindTriageForm({
      form: document.querySelector("form"),
      input: document.querySelector("#message"),
      button: document.querySelector("button"),
      status: document.querySelector("#status"),
      result: document.querySelector("#result"),
      topic: document.querySelector("#topic"),
      draft: document.querySelector("#draft"),
    });
  </script>
</body>
</html>
